services:
  auth-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/auth_service
      DB_USERNAME: ${DB_USERNAME:-auth_service}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # 빈 문자열이면 Spring의 ${VAR:default} 플레이스홀더가 "설정됨(빈 값)"으로 보고 자체 기본값을
      # 쓰지 않아 OAuth2ClientProperties 검증에서 부팅이 실패한다(2026-08-03 실제 기동으로 발견) -
      # 여기서 비-공백 placeholder를 기본값으로 둬서 어느 쪽이 비어도 항상 부팅되게 한다.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-unconfigured-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-unconfigured-google-client-secret}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-unconfigured-kakao-client-id}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-unconfigured-kakao-client-secret}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-unconfigured-naver-client-id}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-unconfigured-naver-client-secret}
      OAUTH2_FRONTEND_REDIRECT_URI: ${OAUTH2_FRONTEND_REDIRECT_URI:-http://localhost:3000/oauth2/callback}
    # plain `depends_on` only waits for the container to be *created*, not ready to accept
    # connections - auth-service crashed on first boot because MariaDB was still initializing
    # (found via a real docker-compose run, 2026-08-03). `condition: service_healthy` fixes it.
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: auth_service
      MARIADB_USER: ${DB_USERNAME:-auth_service}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mariadb-data:
