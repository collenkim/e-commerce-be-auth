spring.application.name=e-commerce-be-auth-test

# In-memory H2 for repository slice tests - Flyway migrations target MariaDB syntax,
# so schema is generated from JPA mappings instead (ddl-auto) rather than running V1__*.sql here.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.jwt.secret=test-secret-key-must-be-at-least-32-bytes-long
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=14d

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.account.email-verification-token-ttl=24h
app.account.password-reset-token-ttl=30m

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

app.social-login.pending-link-ttl=10m
app.social-login.frontend-redirect-uri=http://localhost:3000/oauth2/callback

app.rate-limit.ip-limit-per-window=10
app.rate-limit.ip-window=60s
app.rate-limit.ip-violation-threshold=3
app.rate-limit.ip-violation-window=60s
app.rate-limit.account-failure-threshold=5
app.rate-limit.account-window=10m
app.rate-limit.brute-force-distinct-account-threshold=10
app.rate-limit.brute-force-window=5m
app.rate-limit.block-duration=15m
