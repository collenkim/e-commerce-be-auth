spring.application.name=e-commerce-be-auth

# --- Datasource (MariaDB, shared-infrastructure.md) ---
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/auth_service}
spring.datasource.username=${DB_USERNAME:auth_service}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true

# --- Redis (shared-infrastructure.md) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Token Unit (JWT) ---
# JWT_HMAC_SECRET must be injected via environment/secrets manager - never committed (SECURITY-12)
app.jwt.secret=${JWT_HMAC_SECRET}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=14d

# --- RabbitMQ (shared-infrastructure.md, email.events exchange) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- Account Unit ---
app.account.email-verification-token-ttl=24h
app.account.password-reset-token-ttl=30m

# --- SocialLogin Unit (OAuth2) ---
# 실제 client-id/secret 없이는 카카오/네이버/구글 로그인 기능만 동작하지 않는다(구조만 마련, 사전 결정).
# NOTE(정정, 2026-08-03 실제 docker-compose 기동으로 확인): 빈 client-id는 Spring Boot의
# OAuth2ClientProperties 검증에서 "Client id of registration 'x' must not be empty"로 부팅 자체를
# 막는다 - RateLimit Unit 때 "기우였다"고 결론 내린 것은 테스트가 실제로는 더미 비어있지 않은 값
# (test-client-id)을 쓰고 있어서 이 경로를 검증하지 못했기 때문이었다(잘못된 결론, integration-points.md
# 정정 기록). placeholder 비-공백 기본값으로 부팅은 항상 되게 하고, 소셜 로그인 기능만 비활성 상태로 둔다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unconfigured-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unconfigured-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:unconfigured-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:unconfigured-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=account_email
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:unconfigured-naver-client-id}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:unconfigured-naver-client-secret}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=email
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

app.social-login.pending-link-ttl=10m
app.social-login.frontend-redirect-uri=${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth2/callback}

# --- RateLimit Unit ---
app.rate-limit.ip-limit-per-window=10
app.rate-limit.ip-window=60s
app.rate-limit.ip-violation-threshold=3
app.rate-limit.ip-violation-window=60s
app.rate-limit.account-failure-threshold=5
app.rate-limit.account-window=10m
app.rate-limit.brute-force-distinct-account-threshold=10
app.rate-limit.brute-force-window=5m
app.rate-limit.block-duration=15m
